name: release

# Build, publish a GitHub release and bump the Homebrew cask.
# Trigger by pushing a tag like `v0.1.0`:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag name ends up in Info.plist and in the cask (Ruby), so accept
      # only version-shaped tags such as v0.1.0 or v1.0.0-rc.1.
      - name: Check the tag name
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Build and zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh
          ditto -c -k --keepParent build/BlackSharkBattery.app "BlackSharkBattery-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 "BlackSharkBattery-${GITHUB_REF_NAME#v}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "BlackSharkBattery-${GITHUB_REF_NAME#v}.zip" SHA256SUMS --generate-notes

      - name: Bump cask in this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "BlackSharkBattery-$V.zip" | cut -d' ' -f1)"
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$V\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/blackshark-battery.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cask: blackshark-battery $V"
          git push origin main
